<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mahalle Döner</title>
  <meta name="description" content="Mahalle Döner Bitez, Bodrum — menü, Instagram, web sitesi, yol tarifi ve değerlendirme." />
  <meta name="theme-color" content="#7a1e12" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #7a1e12;
      --red-soft: #9c2a1a;
      --cream: #fbf3e6;
      --cream-2: #f4e6cf;
      --brown: #3a2417;
      --gold: #c9922e;
      --gold-soft: #e2b45a;
      --ink: #2b1a10;
      --muted: #8a6f57;
      --card: #fffaf1;
      --line: #e7d6ba;
      --shadow: 0 10px 26px rgba(58, 36, 23, .14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -8%, #9c2a1a 0%, #7a1e12 42%, #5f160d 100%);
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 34px 20px 40px;
    }

    .hub { width: 100%; max-width: 440px; text-align: center; }

    /* ---------- Brand ---------- */
    .logo {
      width: 92px; height: 92px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--cream);
      display: grid; place-items: center;
      font-size: 46px;
      box-shadow: 0 8px 22px rgba(0,0,0,.28);
      border: 3px solid var(--gold-soft);
    }
    .brand {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 38px;
      color: var(--cream);
      line-height: 1.1;
      letter-spacing: .5px;
    }
    .brand span { color: var(--gold-soft); }
    .sub {
      margin-top: 8px;
      font-size: 14px;
      color: rgba(251, 243, 230, .8);
      letter-spacing: .3px;
    }
    .status {
      margin-top: 14px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: rgba(251, 243, 230, .85);
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(226,180,90,.35);
      padding: 6px 14px;
      border-radius: 999px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #6ad07f; box-shadow: 0 0 0 3px rgba(106,208,127,.25); }

    /* ---------- Link buttons ---------- */
    .links { margin-top: 30px; display: flex; flex-direction: column; gap: 13px; }
    .link {
      display: flex;
      align-items: center;
      gap: 15px;
      text-decoration: none;
      background: var(--card);
      color: var(--ink);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 16px;
      padding: 17px 18px;
      box-shadow: var(--shadow);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .link:active { transform: scale(.98); }
    .link .ic {
      width: 46px; height: 46px;
      flex: 0 0 auto;
      border-radius: 12px;
      display: grid; place-items: center;
      font-size: 24px;
      background: var(--cream-2);
    }
    .link .tx { flex: 1 1 auto; text-align: left; }
    .link .tx b { display: block; font-size: 16.5px; font-weight: 700; }
    .link .tx small { color: var(--muted); font-size: 12.5px; }
    .link .arrow { color: var(--muted); font-size: 20px; flex: 0 0 auto; }

    .link.primary { background: var(--gold-soft); }
    .link.primary .ic { background: rgba(122,30,18,.14); }
    .link.primary .tx small { color: #7a5a18; }

    /* ---------- Review CTA ---------- */
    .review {
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      background: transparent;
      color: var(--cream);
      border: 1.5px solid var(--gold-soft);
      border-radius: 14px;
      padding: 15px 18px;
      font-weight: 700;
      font-size: 15px;
      transition: background .12s ease;
    }
    .review:active { background: rgba(226,180,90,.15); }
    .review .stars { color: var(--gold-soft); letter-spacing: 2px; }

    /* ---------- Footer ---------- */
    .foot {
      margin-top: 26px;
      color: rgba(251, 243, 230, .65);
      font-size: 12px;
      line-height: 1.7;
    }
    .foot a { color: rgba(251, 243, 230, .85); text-decoration: none; }
  </style>
</head>
<body>
  <main class="hub">
    <div class="logo">🥙</div>
    <h1 class="brand">Mahalle <span>Döner</span></h1>
    <p class="sub">Bitez · Bodrum</p>
    <div class="status"><span class="dot"></span> Her gün 11:00 – 00:00</div>

    <nav class="links">
      <a class="link primary" href="menu.html">
        <span class="ic">🍽️</span>
        <span class="tx"><b>Menü</b><small>Ürünler ve fiyatlar</small></span>
        <span class="arrow">›</span>
      </a>

      <a class="link" href="https://www.instagram.com/mahalle.doner/" target="_blank" rel="noopener">
        <span class="ic">📷</span>
        <span class="tx"><b>Instagram</b><small>@mahalle.doner</small></span>
        <span class="arrow">›</span>
      </a>

      <a class="link" href="https://mahalledoner.com/" target="_blank" rel="noopener">
        <span class="ic">🌐</span>
        <span class="tx"><b>Web Sitesi</b><small>mahalledoner.com</small></span>
        <span class="arrow">›</span>
      </a>

      <a class="link" href="https://www.google.com/maps/place/Mahalle+D%C3%B6ner/@37.0427627,27.377442,17z/data=!4m6!3m5!1s0x14be6d2a2d23bf01:0x50c6f681c5d2893c!8m2!3d37.0427584!4d27.3800169!16s%2Fg%2F11zbx4twwd" target="_blank" rel="noopener">
        <span class="ic">📍</span>
        <span class="tx"><b>Maps / Yol Tarifi</b><small>Bitez, Cami Sk. 13-11</small></span>
        <span class="arrow">›</span>
      </a>
    </nav>

    <a class="review" href="https://www.google.com/maps/place//data=!4m6!3m5!1s0x14be6d2a2d23bf01:0x50c6f681c5d2893c!8m2!3d37.0427584!4d27.3800169!16s%2Fg%2F11zbx4twwd!9m1!1b1" target="_blank" rel="noopener">
      <span class="stars">★★★★★</span> Bizi Google'da Değerlendir
    </a>

    <p class="foot">
      Mahalle Döner · Bitez, Cami Sk. 13-11, Bodrum<br />
      <a href="tel:+905331924831">0533 192 48 31</a>
    </p>
  </main>
</body>
</html>
