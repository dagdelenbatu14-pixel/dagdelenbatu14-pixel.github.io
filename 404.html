<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Sayfa Bulunamadı · Psikolog Dicle Buse Erol</title>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root { --terracotta:#c97b5d; --paper:#fdf8ed; --cream:#f5ead8; --brown-2:#2d2017; --ink-soft:rgba(45,32,23,.78); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Inter",system-ui,sans-serif; color:var(--brown-2); background:
    radial-gradient(circle at 85% 15%, rgba(201,123,93,.14), transparent 55%), linear-gradient(180deg,var(--paper),var(--cream));
    min-height:100vh; display:grid; place-items:center; text-align:center; padding:24px; }
  .code { font-family:"Fraunces",Georgia,serif; font-style:italic; font-size:clamp(5rem,20vw,11rem); color:var(--terracotta); line-height:1; margin:0; }
  h1 { font-family:"Fraunces",Georgia,serif; font-weight:500; font-size:clamp(1.5rem,4vw,2.3rem); margin:.4rem 0 1rem; }
  p { color:var(--ink-soft); max-width:30rem; margin:0 auto 2rem; }
  a { display:inline-flex; align-items:center; gap:10px; padding:15px 32px; background:var(--terracotta); color:var(--paper);
    text-decoration:none; font-size:.82rem; font-weight:500; letter-spacing:.14em; text-transform:uppercase; border-radius:999px; transition:background .25s ease; }
  a:hover { background:#a85a3e; }
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Aradığınız sayfa bulunamadı</h1>
    <p>Sayfa taşınmış ya da kaldırılmış olabilir. Ana sayfaya dönerek devam edebilirsiniz.</p>
    <a href="/">Ana Sayfaya Dön</a>
  </main>
</body>
</html>
