<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sayfa Bulunamadı | Psikolog Dicle Buserol</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%235a7363'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Georgia,serif' fill='%23f7f4ef' text-anchor='middle'%3EDB%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="styles.css" />
  <style>
    .nf { min-height: 80vh; display: grid; place-items: center; text-align: center;
      background: radial-gradient(900px 500px at 50% -10%, var(--sage-soft), transparent 60%), var(--cream); }
    .nf-code { font-family: var(--serif); font-size: clamp(5rem, 18vw, 10rem); color: var(--sage-dark); line-height: 1; }
    .nf h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin: 0.5rem 0 1rem; }
    .nf p { color: var(--muted); max-width: 30rem; margin: 0 auto 2rem; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="container">
      <div class="nf-code">404</div>
      <h1>Aradığınız sayfayı bulamadık</h1>
      <p>Sayfa taşınmış veya kaldırılmış olabilir. Ana sayfaya dönerek devam edebilirsiniz.</p>
      <a href="/" class="btn btn-primary">Ana Sayfaya Dön</a>
    </div>
  </main>
</body>
</html>
